[project]
name = "sentinel-backend"
version = "0.1.0"
description = "SentinelVAPT API and scan worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx2>=2.13",
  "ruff>=0.6",
  "mypy>=1.11",
  # Generates a throwaway self-signed certificate for the local TLS contract test.
  "cryptography>=43",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running PostgreSQL (DATABASE_URL)",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
