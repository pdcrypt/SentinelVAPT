# Lab target only (docker compose --profile lab). Serves the static lab site
# and adds the response headers of the active lab variant (tests/lab/variants,
# selected with tests/lab/lab-variant.sh). The active copy lives in a tmpfs
# inside the container: switching variants never writes to the repository.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/lab-active/headers.inc;
}
