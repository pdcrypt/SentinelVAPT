[project]
name = "sentinel-reports"
version = "0.1.0"
description = "SentinelVAPT report generation from persisted assessment snapshots"
requires-python = ">=3.12"
# Jinja2 (HTML) and an optional PDF renderer are added in Phase 5.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_reports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
