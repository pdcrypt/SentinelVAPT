# SentinelVAPT local stack.
# All ports are bound to 127.0.0.1 only. Localhost-only is the policy even
# with platform authentication in place: network exposure is a non-goal
# (docs/adr/0005, docs/adr/0014). Do not bind to 0.0.0.0.

name: sentinel-vapt

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # "reporting" lets the report worker reach the database and nothing else.
    networks: [default, reporting]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies database migrations, then exits. The backend waits for it.
  migrate:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: *backend-build
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Scan worker (ADR 0008, 0009): claims queued scans and analysis runs from
  # PostgreSQL and runs the scanner. No published ports. Scans reach lab
  # targets only: the scanner refuses public addresses.
  worker:
    build: *backend-build
    command: ["python", "-m", "app.worker", "--role", "scans"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Report worker (ADR 0010): renders queued reports from their frozen
  # snapshots. Same image, separate process, so a long scan never delays a
  # report and the PDF engine never runs next to the scanner. Its only network
  # is "reporting", which is internal: it can reach the database and nothing
  # else (no lab targets, no internet).
  report-worker:
    build: *backend-build
    command: ["python", "-m", "app.worker", "--role", "reports"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks: [reporting]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional local lab target for manual end-to-end scans:
  #   docker compose --profile lab up -d
  # Static pages only. The worker reaches it as http://lab-target/ on the
  # compose network; the host port is bound to 127.0.0.1 only.
  lab-target:
    image: nginx:1.27-alpine
    profiles: ["lab"]
    restart: unless-stopped
    # Header variants A/B/C for retest demos (tests/lab/README.md); switched
    # with `docker compose exec lab-target sh /lab/lab-variant.sh b`. The active
    # variant lives in a tmpfs: recreating the container restores variant A.
    command: ["/bin/sh", "/lab/lab-variant.sh", "start"]
    volumes:
      - ./tests/lab/site:/usr/share/nginx/html:ro
      - ./tests/lab/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/lab/variants:/etc/nginx/lab-variants:ro
      - ./tests/lab/lab-variant.sh:/lab/lab-variant.sh:ro
    tmpfs:
      - /etc/nginx/lab-active
    ports:
      - "127.0.0.1:8081:80"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

networks:
  default: {}
  reporting:
    internal: true

volumes:
  db-data:
